services:
  - type: web
    name: stagehub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DB_CA
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: stagehub-photos
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECURE_COOKIES
        value: '1'
